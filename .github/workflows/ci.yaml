name: Build and Push

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  REPOSITORY_OWNER: ${{ github.repository_owner }}

jobs:
  build-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Calculate Lowercase Image Name
        id: calculate_api
        run: echo "image_name_lc=ghcr.io/${{ env.REPOSITORY_OWNER }}/uniquezer-api" >> $GITHUB_OUTPUT

      - name: Login to the registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for API
        id: meta_api
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.calculate_api.outputs.image_name_lc }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.sha }}

      - name: Build and push API Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./uniquezer-api
          push: true
          tags: ${{ steps.meta_api.outputs.tags }}
          cache-from: |
            type=registry,ref=ghcr.io/${{ env.REPOSITORY_OWNER }}/uniquezer-api:buildcache
            type=registry,ref=ghcr.io/${{ env.REPOSITORY_OWNER }}/uniquezer-api:latest
          cache-to: type=registry,ref=ghcr.io/${{ env.REPOSITORY_OWNER }}/uniquezer-api:buildcache,mode=max

  build-ui:
    runs-on: ubuntu-latest
    needs: build-api
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Calculate Lowercase Image Name
        id: calculate_ui
        run: echo "image_name_lc=ghcr.io/${{ env.REPOSITORY_OWNER }}/uniquezer-ui" >> $GITHUB_OUTPUT

      - name: Login to the registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for UI
        id: meta_ui
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.calculate_ui.outputs.image_name_lc }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.sha }}

      - name: Build and push UI Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./uniquezer-ui
          push: true
          tags: ${{ steps.meta_ui.outputs.tags }}
          build-args: |
            NUXT_PUBLIC_GTAG_ID=${{ secrets.NUXT_PUBLIC_GTAG_ID }}
            NUXT_PUBLIC_YANDEX_METRIKA_ID=${{ secrets.NUXT_PUBLIC_YANDEX_METRIKA_ID }}
            NODE_ENV=${{ secrets.NODE_ENV }}
          cache-from: |
            type=registry,ref=ghcr.io/${{ env.REPOSITORY_OWNER }}/uniquezer-ui:buildcache
            type=registry,ref=ghcr.io/${{ env.REPOSITORY_OWNER }}/uniquezer-ui:latest
          cache-to: type=registry,ref=ghcr.io/${{ env.REPOSITORY_OWNER }}/uniquezer-ui:buildcache,mode=max
